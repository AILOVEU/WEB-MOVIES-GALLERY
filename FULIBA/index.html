<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>福利吧 fuliba2023.net 全站文章</title>
<link rel="stylesheet" href="data/common/style.css">
<style>
.mini{border:1px solid var(--line);background:transparent;color:var(--fg2);border-radius:5px;padding:1px 9px;font-size:12px;cursor:pointer;margin-left:6px}
.mini:hover{border-color:var(--acc);color:var(--acc)}
.msg{color:var(--acc);font-size:13px}
</style>
</head><body>
<header class="hero">
  <div class="hero-in">
    <h1>福利吧 · 全站文章</h1>
    <p class="sub" id="heroSub">fuliba2023.net</p>
    <p class="gen">数据来档于本地各年目录（data/&lt;年&gt;/）· 生成于 2026-11-24 08:54:12</p>
  </div>
</header>

<nav class="bar">
  <div class="bar-in">
    <input id="q" type="search" placeholder="搜索标题 / 正文 / 分类…" autocomplete="off">
    <select id="cat"><option value="">全部分类</option></select>
    <select id="year"><option value="">全部年份</option></select>
    <span class="cnt" id="cnt"></span>
    <button id="imgModeBtn" type="button" title="切换所有文章页的图片来源：本机 assets/images（本地）或原始地址（省图库，需联网）">🖼 图片源：<b></b></button>
  </div>
</nav>

<main>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
  <p class="empty" id="empty" hidden>没有匹配的文章</p>
</main>

<footer class="foot">
  <p>本站仅收录 fuliba2023.net 公开内容页，版权归原作者所有；评论与图片均已本地化保存。</p>
</footer>


<script src="data/manifest.js"></script>
<script>
/* 全局图片来源开关：只读写 localStorage('fuliba_img_mode')，作用于所有文章页
   （文章页 IMG_MODE_JS 启动时读同一 key）。首页自身不展示正文图，这里仅做预设。 */
(function(){
  var KEY='fuliba_img_mode', b=document.getElementById('imgModeBtn');
  if(!b) return;
  var lab=b.querySelector('b');
  function paint(m){ if(lab) lab.textContent=(m==='orig')?'原始地址':'本地'; b.classList.toggle('on',m==='orig'); }
  var cur='local'; try{ cur=localStorage.getItem(KEY)||'local'; }catch(e){}
  paint(cur==='orig'?'orig':'local');
  b.addEventListener('click',function(){
    var next=b.classList.contains('on')?'local':'orig';
    try{ localStorage.setItem(KEY,next); }catch(e){}
    paint(next);
  });
})();
</script>
<script>
/* ===== 首页：按需加载年份数据 =====
   不再枚举全部年份。首屏只拉「从最新年份往下、凑够 20 篇」所需的年份文件：
     - 统计 / 年份下拉 / 分类下拉 全部来自 data/manifest.js（几百字节），不等文章数据
     - 翻到第 N 页  → 继续加载到 N*20 篇
     - 选年份       → 只加载该年
     - 搜索 / 选分类 → 加载全部年份（跨年才准确）
   关键：按年份倒序累计，凑够 20 篇才停。否则新年份刚建目录只有几篇时，
   首页会只剩那几篇，上一年的文章全被漏掉。
   data.js 格式不变，仍是 window.FULIBA_YEAR("<年>", [...])。 */
(function(){
  var DP = 'data/';
  var MAN = window.FULIBA_MANIFEST;
  var PAGE = 20;
  var loaded = {};      /* 年 -> items[] */
  var inflight = {};    /* 年 -> Promise */
  var page = 0, list = [];

  var $ = function(s){ return document.querySelector(s); };
  var catSel = $('#cat'), yearSel = $('#year');

  if(!MAN){
    var hs = $('#heroSub');
    if(hs) hs.textContent = '站点清单缺失：请先运行 _scripts\py.cmd _scripts\build\s06_build_site.py';
    var c0 = $('#cnt'); if(c0) c0.textContent = '清单缺失';
    return;
  }

  /* ---- 头部统计与下拉框：只依赖 manifest，不等任何年份数据 ---- */
  (function(){
    var n = $('#heroSub');
    if(n) n.textContent = MAN.domain + ' — 共 ' + MAN.total.toLocaleString() + ' 篇文章 · '
      + MAN.total_comments.toLocaleString() + ' 条评论 · ' + MAN.total_images.toLocaleString() + ' 张本地图片';
    Object.keys(MAN.categories).sort().forEach(function(c){
      var o=document.createElement('option'); o.value=c; o.textContent=c+' ('+MAN.categories[c]+')'; catSel.appendChild(o);
    });
    Object.keys(MAN.years).sort().reverse().forEach(function(y){
      var o=document.createElement('option'); o.value=y; o.textContent=y+' ('+MAN.years[y]+')'; yearSel.appendChild(o);
    });
  })();

  /* ---- 加载器 ---- */
  function loadScript(src){
    return new Promise(function(res){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ res(true); };
      s.onerror = function(){ res(false); };
      document.head.appendChild(s);
    });
  }
  window.FULIBA_YEAR = function(y, items){ loaded[y] = items || []; };

  function loadYear(y){
    if(loaded[y]) return Promise.resolve(true);
    if(inflight[y]) return inflight[y];
    inflight[y] = loadScript(DP + y + '/data.js').then(function(ok){
      if(!ok) loaded[y] = [];   /* 缺失年份记为空数组，避免反复请求 404 */
      delete inflight[y];
      return ok;
    });
    return inflight[y];
  }
  function yearsDesc(){ return Object.keys(MAN.years).sort().reverse(); }
  function loadedCount(){
    var n = 0;
    for(var k in loaded) n += loaded[k].length;
    return n;
  }
  function allLoaded(){ return loadedCount() >= MAN.total; }

  /* 从最新年份往下加载，累计 >= need 条就停 */
  function loadUntil(need){
    var ys = yearsDesc(), i = 0;
    function step(){
      if(loadedCount() >= need || i >= ys.length) return Promise.resolve();
      return loadYear(ys[i++]).then(step);
    }
    return step();
  }
  function loadAll(){ return Promise.all(yearsDesc().map(loadYear)); }

  function merged(){
    var all = [];
    for(var k in loaded) all = all.concat(loaded[k]);
    all.sort(function(x,y){ return (y.date||'').localeCompare(x.date||''); });
    return all;
  }

  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  /* ---- 翻页状态：点进文章再返回，还停在原来那页 ---- */
  var SS = 'fuliba_list_state_v1';
  function saveState(){
    try{
      sessionStorage.setItem(SS, JSON.stringify({
        page: page,
        q: $('#q').value,
        cat: catSel.value,
        year: yearSel.value,
        y: window.scrollY || 0
      }));
    }catch(e){}
  }
  function loadState(){
    try{ var s = sessionStorage.getItem(SS); return s ? JSON.parse(s) : null; }
    catch(e){ return null; }
  }

  /* ---- 渲染 ---- */
  function card(a){
    var imgs = [];
    (a.imgs>0) && imgs.push('<span class="tag t-img">图 '+a.imgs+'</span>');
    (a.page_count>1) && imgs.push('<span class="tag t-pg">全文 '+a.page_count+' 页</span>');
    (a.comments_parsed>0) && imgs.push('<span class="tag t-cmt">评 '+a.comments_parsed+'</span>');
    (a.view_count>0) && imgs.push('<span class="tag t-view">阅 '+a.view_count+'</span>');
    return '<article class="card">'+
      '<a class="c-title" href="' + DP + a.y + '/part' + a.p + '.html#' + a.id + '">' + esc(a.title||'(无标题)') + '</a>'+
      '<div class="c-meta"><span class="c-date">'+esc(a.date)+'</span>'+
      (a.category?'<a class="c-cat" href="#" data-cat="'+esc(a.category)+'">'+esc(a.category)+'</a>':'')+
      imgs.join('')+'</div>'+
      '<p class="c-sum">'+esc(a.summary)+'…</p>'+
      '<a class="c-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">原文 ↗</a>'+
      '</article>';
  }

  function isFiltered(){
    return !!(yearSel.value || catSel.value || $('#q').value.trim());
  }
  /* 未筛选且未加载全量时，总篇数用 manifest 的真值，不用已加载条数 */
  function totalForCount(){
    return (!isFiltered() && !allLoaded()) ? MAN.total : list.length;
  }
  function totalForPager(){
    return (!isFiltered() && !allLoaded()) ? MAN.total : list.length;
  }

  function pageNumbers(cur, total){
    var arr=[], lo=Math.max(0,cur-2), hi=Math.min(total-1,cur+2), i;
    if(lo>0){ arr.push(0); if(lo>1) arr.push('…'); }
    for(i=lo;i<=hi;i++) arr.push(i);
    if(hi<total-1){ if(hi<total-2) arr.push('…'); arr.push(total-1); }
    return arr;
  }
  function renderPager(){
    var box=$('#pager'); if(!box) return;
    var total=Math.ceil(totalForPager()/PAGE);
    if(total<=1){ box.innerHTML=''; return; }
    var h='<button class="pnav" data-pg="'+(page-1)+'"'+(page<=0?' disabled':'')+'>‹ 上一页</button>';
    var nums=pageNumbers(page,total);
    for(var k=0;k<nums.length;k++){
      if(nums[k]==='…'){ h+='<span class="pinfo">…</span>'; }
      else { var n=nums[k]; h+='<button class="pbtn'+(n===page?' cur':'')+'" data-pg="'+n+'">'+(n+1)+'</button>'; }
    }
    h+='<button class="pnav" data-pg="'+(page+1)+'"'+(page>=total-1?' disabled':'')+'>下一页 ›</button>';
    h+='<span class="pinfo">第 '+(page+1)+' / '+total+' 页</span>';
    box.innerHTML=h;
  }
  function render(){
    var start=page*PAGE, end=Math.min(start+PAGE, list.length), html='';
    for(var i=start;i<end;i++) html+=card(list[i]);
    $('#list').innerHTML=html;
    var shown=totalForCount();
    $('#cnt').textContent = list.length
      ? ('第 '+(start+1)+'-'+end+' 篇 / 共 '+shown.toLocaleString()+' 篇')
      : '共 0 篇';
    renderPager();
    $('#empty').hidden = list.length>0;
    saveState();
  }

  /* ---- 筛选 ---- */
  function applyFilter(){
    var q=$('#q').value.trim().toLowerCase(), c=catSel.value, y=yearSel.value;
    var src = merged();
    list = src.filter(function(a){
      if(c && a.category!==c) return false;
      if(y && (a.date||'').slice(0,4)!==y) return false;
      if(q){
        var hay=(a.title+' '+a.category+' '+a.summary+' '+(a.tags||[]).join(' ')).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }

  /* 按当前筛选条件决定要加载哪些年份 */
  function ensureForFilter(){
    var y=yearSel.value, q=$('#q').value.trim(), c=catSel.value;
    if(q || c) return loadAll();          /* 跨年搜索 / 分类统计：必须全量才准 */
    if(y) return loadYear(y);             /* 选定年份：只拉这一年 */
    return loadUntil((page+1)*PAGE);      /* 默认：够当前页就行 */
  }

  function busy(on, txt){
    var el=$('#cnt');
    if(!el) return;
    if(on){ el.setAttribute('data-busy','1'); el.textContent = txt || '加载中…'; }
    else { el.removeAttribute('data-busy'); }
  }

  /* 统一的「加载 → 筛选 → 渲染」入口 */
  function go(resetPage){
    if(resetPage) page = 0;
    busy(true);
    return ensureForFilter().then(function(){
      applyFilter();
      var tp = Math.ceil(list.length/PAGE);
      if(page > tp-1) page = Math.max(0, tp-1);
      busy(false);
      render();
    });
  }

  /* ---- 事件 ---- */
  var t=null;
  $('#q').addEventListener('input',function(){
    clearTimeout(t);
    t=setTimeout(function(){ go(true); }, 260);
  });
  catSel.addEventListener('change',function(){ go(true); });
  yearSel.addEventListener('change',function(){ go(true); });

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-pg]');
    if(!b || b.hasAttribute('disabled')) return;
    var p=parseInt(b.getAttribute('data-pg'),10);
    var tp=Math.ceil(totalForPager()/PAGE);
    if(isNaN(p)||p<0||p>=tp||p===page) return;
    page=p;
    /* 目标页可能还没加载到，先补数据再渲染 */
    busy(true);
    loadUntil((page+1)*PAGE).then(function(){
      applyFilter();
      busy(false);
      render();
      var m=document.querySelector('main');
      window.scrollTo(0, m?m.offsetTop-58:0);
    });
  });
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-cat]');
    if(a){ e.preventDefault(); catSel.value=a.getAttribute('data-cat'); go(true); }
  });

  /* ---- 启动 ---- */
  (function boot(){
    var st = loadState();
    if(st){
      if(st.q) $('#q').value = st.q;
      if(st.cat) catSel.value = st.cat;
      if(st.year) yearSel.value = st.year;
      if(st.page > 0) page = st.page|0;
    }
    busy(true);
    ensureForFilter().then(function(){
      applyFilter();
      var tp = Math.ceil(list.length/PAGE);
      page = Math.min(Math.max(0, page|0), Math.max(0, tp-1));
      busy(false);
      render();
      if(st && st.y) window.scrollTo(0, st.y);
    });
  })();

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
})();
</script>
</body></html>
