<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T66Y · 草榴國產原創區 離線清單</title>
<style>
  :root{
    --bg:#0e1116; --card:#161a21; --fg:#e6e8eb; --muted:#8a93a3; --line:#232a34;
    --acc:#e2417a; --link:#5aa9ff; --tc:#8a93a3;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}

  header{flex:none;background:rgba(14,17,22,.96);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 18px 10px}
  h1{margin:0 0 2px;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1 .sub{color:var(--muted);font-size:12px;font-weight:400}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
  input[type=search]{flex:1;min-width:180px;padding:7px 12px;border:1px solid var(--line);
    border-radius:8px;background:#0f1319;color:var(--fg);font-size:16px}
  input[type=search]:focus{outline:none;border-color:#3a4656}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:#0f1319;color:var(--fg);font-size:13px}
  .btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#0f1319;
    color:var(--muted);cursor:pointer;font-size:13px;user-select:none}
  .btn:hover{background:#1a1f28;color:var(--fg)}
  .btn.danger{color:#e07a8a;border-color:#5a2f37;background:#1b1216}
  .btn.danger:hover{background:#241419;border-color:#7a3a45}
  .seencount{color:var(--acc);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 标签 chips */
  #tagchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;max-height:132px;overflow:auto}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line);
    border-left:2px solid var(--tc);border-radius:14px;background:#0f1319;color:#aab3c0;
    cursor:pointer;font-size:12.5px;user-select:none;transition:.1s;white-space:nowrap;min-height:28px}
  .chip:hover{background:#1a1f28;color:var(--fg)}
  .chip.on{background:var(--tc);border-color:var(--tc);color:#0e1116;font-weight:600}
  .chip.on i{color:rgba(0,0,0,.55)}
  .chip i{font-style:normal;font-size:11px;color:#5c6572}
  .chip.st{border-style:dashed}

  #activefilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;
    font-size:12.5px;min-height:20px}
  .af{background:#1d2430;border:1px solid #2f3a49;border-radius:6px;padding:2px 8px;color:#c2cad6}
  .af.none{background:none;border:none;color:#5c6572;padding:0}
  .af.clear{background:#2a1620;border-color:#5a2f37;color:#e07a8a;cursor:pointer}
  .af.clear:hover{background:#3a1c28}

  /* 虚拟滚动：viewport 滚动，spacer 撑总高，vlist 只渲染可见行 */
  .list{flex:1;min-height:0;max-width:1180px;width:100%;margin:0 auto;
        padding:10px 14px 0;display:flex;flex-direction:column}
  #loading{flex:none;text-align:center;color:var(--muted);padding:20px;font-size:13px}
  #viewport{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  #spacer{position:relative;width:100%}
  #vlist{position:absolute;top:0;left:0;right:0;will-change:transform}

  /* 固定行高 109px + 7px 间距 = ROW_H 116px，虚拟滚动按此计算 */
  .row{height:109px;margin-bottom:7px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;padding:9px 14px;overflow:hidden;transition:border-color .1s,background .1s}
  .row:hover{border-color:#3a4656;background:#1a1f28}
  .row.stick{border-color:#4a3a17;background:#1b1a13}
  .row.stick:hover{border-color:#6d5522;background:#211f16}
  .row.seen{border-left:3px solid var(--acc);padding-left:12px;opacity:.72}
  .row.seen:hover{opacity:1}

  .rt{font-size:15px;font-weight:600;line-height:1.45;word-break:break-word;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rt a:hover{color:var(--link)}
  .pin,.lk,.pg{display:inline-block;font-size:10.5px;line-height:1;padding:2px 6px;
    border-radius:4px;margin-right:6px;vertical-align:middle;font-weight:600}
  .pin{background:#4a3a17;color:#f0c060;border:1px solid #6d5522}
  .lk{background:#2a2f38;color:#8a93a3;border:1px solid #3a444f}
  .pg{background:#16243a;color:#5aa9ff;border:1px solid #2b4a72;margin-left:6px;margin-right:0}

  /* 点过开关 */
  .seen-btn{flex:none;width:20px;height:20px;line-height:1;padding:0;border-radius:50%;
    border:1px solid var(--line);background:#0f1319;color:#5c6572;cursor:pointer;font-size:12px}
  .seen-btn:hover{border-color:var(--acc);color:var(--acc)}
  .seen-btn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}

  .rm{display:flex;gap:11px;flex-wrap:nowrap;align-items:center;margin-top:6px;
    color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
  .rm .au{color:#c2cad6;font-weight:600;flex:none}
  .rm .n{color:#9aa4b2;flex:none}
  .rm .lz{color:#6f7a89;flex:none}
  .rm .pgno{margin-left:auto;color:#4a5260;font-size:11px;font-variant-numeric:tabular-nums;flex:none}

  .rtt{display:flex;flex-wrap:nowrap;gap:4px;margin-top:5px;height:20px;overflow:hidden}
  .tg{display:inline-block;flex:none;font-size:11px;line-height:1;padding:3px 7px;border-radius:4px;
    background:#1a2029;border:1px solid #2a3340;color:var(--tc);letter-spacing:.2px}
  .tg.sm{font-size:10.5px;padding:2px 6px}
  .tg.st{border-style:dashed}

  #empty{flex:none;text-align:center;color:var(--muted);padding:60px 20px}
  #stat{flex:none;color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
  .foot{flex:none;color:#4a5260;text-align:center;padding:10px 14px 14px;font-size:11.5px;line-height:1.6}

  @media(max-width:720px){
    header{padding:10px 12px 8px}
    .rm .lz{display:none}
    #tagchips{max-height:104px}
    .list{padding:8px 8px 0}
    .row{padding:8px 10px}
  }
</style>
</head>
<body>

<header>
  <h1>T66Y · 草榴離線清單 <span class="sub" id="meta">加载中…</span></h1>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索标题 / 作者…（全库，输入才加载索引）">
    <select id="sort">
      <option value="page">按页码（新→旧）</option>
      <option value="new">按发帖时间</option>
      <option value="last">按最后回复</option>
      <option value="replies">按回复数</option>
      <option value="downloads">按下载数</option>
    </select>
    <select id="seenfilter" title="按点过状态过滤">
      <option value="all">点过：全部</option>
      <option value="only">只看点过</option>
      <option value="hide">隐藏点过</option>
    </select>
    <span class="seencount" id="seencount"></span>
    <div class="btn" id="clearseen" title="清空所有点过记录">清空点过</div>
    <div class="btn danger" id="reset" title="清空所有筛选条件和排序偏好">还原</div>
  </div>

  <div id="tagchips"></div>
  <div id="activefilters"></div>
</header>

<div class="list">
  <div id="loading">加载中…</div>
  <div id="viewport">
    <div id="spacer"><div id="vlist"></div></div>
  </div>
  <div id="empty" style="display:none">没有符合条件的帖子。放宽筛选试试。</div>
  <div id="stat"></div>
  <div class="foot" id="foot">
    点标题打开原帖会自动记为「点过」；点标题前的 ○/✓ 可手动标记或取消。点过记录存在本机浏览器，可过滤、可清空。
  </div>
</div>

<script src="data/index.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
